<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Marcador Dominó">
<meta name="theme-color" content="#0a0a0f">
<title>Marcador Dominó</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --surface2: #1a1a26;
  --azul: #3b82f6;
  --azul-glow: rgba(59,130,246,0.35);
  --vermelho: #ef4444;
  --verm-glow: rgba(239,68,68,0.35);
  --ouro: #f59e0b;
  --texto: #e8e8f0;
  --muted: #6b6b80;
  --radius: 20px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--texto);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  -webkit-text-size-adjust: 100%;
}

button {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 0; opacity: 0.5;
}

body::after {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none; z-index: 0;
}

/* status firebase */
#fb-status {
  position: fixed;
  top: 10px; right: 12px;
  z-index: 999;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  padding: 4px 10px;
  border-radius: 99px;
  background: rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--muted);
  transition: all 0.3s;
}
#fb-status.ok  { color: #4ade80; border-color: #4ade80; }
#fb-status.err { color: #f87171; border-color: #f87171; }

header {
  position: relative; z-index: 10;
  text-align: center;
  padding: 20px 16px 10px;
}

.header-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(28px, 8vw, 42px);
  letter-spacing: 6px;
  background: linear-gradient(135deg, #fff 30%, var(--muted));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.domino-icon {
  display: inline-flex;
  gap: 4px;
  align-items: center;
  margin-bottom: 6px;
}

.tile {
  width: 22px; height: 38px;
  background: var(--surface2);
  border-radius: 4px;
  border: 1.5px solid rgba(255,255,255,0.12);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-around;
  padding: 4px 3px;
  gap: 2px;
}

.pip-row { display: flex; gap: 3px; }
.pip { width: 4px; height: 4px; border-radius: 50%; background: white; }

.meta-wrap {
  position: relative; z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 8px auto 16px;
}

.meta-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--muted);
}

.meta-input {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px;
  letter-spacing: 2px;
  width: 90px;
  text-align: center;
  background: var(--surface2);
  border: 1.5px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  color: var(--ouro);
  padding: 4px 8px;
  outline: none;
  transition: border-color 0.2s;
}

.meta-input:focus { border-color: var(--ouro); }

.progress-wrap {
  position: relative; z-index: 10;
  margin: 0 12px 18px;
  height: 6px;
  background: var(--surface2);
  border-radius: 99px;
  overflow: visible;
  display: flex;
  gap: 2px;
}

.progress-a, .progress-b {
  height: 100%;
  border-radius: 99px;
  transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
}

.progress-a { background: linear-gradient(90deg, #1d4ed8, var(--azul)); }
.progress-b { background: linear-gradient(90deg, #b91c1c, var(--vermelho)); }

.container {
  position: relative; z-index: 10;
  display: flex;
  gap: 10px;
  padding: 0 12px;
}

.time {
  flex: 1;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 18px 12px 16px;
  text-align: center;
  position: relative;
  overflow: hidden;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  border: 1px solid rgba(255,255,255,0.06);
}

.time::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  border-radius: var(--radius) var(--radius) 0 0;
  transition: opacity 0.3s;
}

.timeA::before { background: linear-gradient(90deg, #1d4ed8, var(--azul), #60a5fa); }
.timeB::before { background: linear-gradient(90deg, #b91c1c, var(--vermelho), #f87171); }

.time::after {
  content: '';
  position: absolute;
  width: 120px; height: 120px;
  border-radius: 50%;
  top: -40px;
  opacity: 0.12;
  filter: blur(40px);
  pointer-events: none;
  transition: opacity 0.4s;
}

.timeA::after { background: var(--azul); left: -20px; }
.timeB::after { background: var(--vermelho); right: -20px; }

.time.lider::after { opacity: 0.3; }
.time.lider { transform: translateY(-3px); }
.timeA.lider { box-shadow: 0 12px 40px var(--azul-glow); }
.timeB.lider { box-shadow: 0 12px 40px var(--verm-glow); }

.flag {
  font-size: 20px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 4px;
}

.nome {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(18px, 5vw, 22px);
  letter-spacing: 3px;
  border: none;
  background: transparent;
  color: white;
  text-align: center;
  width: 100%;
  outline: none;
  border-bottom: 1px solid transparent;
  padding-bottom: 2px;
  transition: border-color 0.2s;
}

.nome:focus { border-bottom-color: rgba(255,255,255,0.2); }

.pontos-wrap { position: relative; margin: 10px 0 14px; }

.pontos {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(80px, 22vw, 110px);
  line-height: 1;
  letter-spacing: -2px;
  transition: transform 0.15s ease, color 0.3s;
  display: block;
}

.timeA .pontos { color: #93c5fd; }
.timeB .pontos { color: #fca5a5; }

.pontos.bump {
  animation: bump 0.25s cubic-bezier(0.36, 0.07, 0.19, 0.97);
}

@keyframes bump {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.12); }
  70%  { transform: scale(0.95); }
  100% { transform: scale(1); }
}

.time.venceu .pontos {
  background: linear-gradient(135deg, var(--ouro), #fde68a, var(--ouro));
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shimmer 2s linear infinite;
}

@keyframes shimmer {
  to { background-position: 200% center; }
}

.botoes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
}

.btn {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px;
  letter-spacing: 1px;
  padding: 12px 6px;
  border-radius: 12px;
  border: none;
  color: white;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform 0.12s, box-shadow 0.2s;
}

.btn::after {
  content: '';
  position: absolute; inset: 0;
  background: rgba(255,255,255,0);
  transition: background 0.15s;
  border-radius: inherit;
}

.btn:active { transform: scale(0.90); }
.btn:active::after { background: rgba(255,255,255,0.15); }

.btn5   { background: linear-gradient(135deg, #15803d, #22c55e); }
.btn10  { background: linear-gradient(135deg, #0e7490, #06b6d4); }
.btn20  { background: linear-gradient(135deg, #7e22ce, #a855f7); }
.btn25  { background: linear-gradient(135deg, #b45309, #f59e0b); }
.btnNeg { background: linear-gradient(135deg, #c2410c, #f97316); padding: 10px; font-size: 18px; }

.vitorias-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 12px 0 6px;
  background: rgba(255,255,255,0.05);
  border-radius: 12px;
  padding: 8px 10px;
}

.vitorias-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  flex: 1;
  text-align: left;
}

.vitorias-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 32px;
  line-height: 1;
  color: var(--ouro);
  min-width: 28px;
  text-align: center;
}

.btn-v {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 16px;
  width: 38px; height: 30px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  color: white;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.12s;
}
.btn-v:active { transform: scale(0.88); }
.btn-v-plus  { background: #16a34a; }
.btn-v-minus { background: #6b7280; }

.bottom {
  position: relative; z-index: 10;
  text-align: center;
  margin: 18px 0 24px;
}

.btn-reset {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 9px 22px;
  border-radius: 99px;
  border: 1px solid rgba(255,255,255,0.15);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.2s;
}

.btn-reset:hover {
  color: white;
  border-color: rgba(255,255,255,0.35);
  background: rgba(255,255,255,0.05);
}

.toast {
  position: fixed;
  bottom: 30px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--ouro);
  color: #000;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 2px;
  padding: 12px 28px;
  border-radius: 99px;
  z-index: 100;
  opacity: 0;
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  white-space: nowrap;
  pointer-events: none;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>

</head>
<body>

<div id="fb-status">⬤ conectando</div>

<header>
  <div class="domino-icon">
    <div class="tile">
      <div class="pip-row"><div class="pip"></div><div class="pip"></div></div>
      <div style="width:100%;height:1px;background:rgba(255,255,255,0.2)"></div>
      <div class="pip-row"><div class="pip"></div><div class="pip"></div></div>
    </div>
    <div class="tile">
      <div class="pip-row"><div class="pip"></div></div>
      <div style="width:100%;height:1px;background:rgba(255,255,255,0.2)"></div>
      <div class="pip-row"><div class="pip"></div><div class="pip"></div></div>
    </div>
  </div>
  <div class="header-title">Marcador Dominó</div>
</header>

<div class="meta-wrap">
  <span class="meta-label">Meta</span>
  <input class="meta-input" type="number" id="meta" value="200">
</div>

<div class="progress-wrap" id="progressWrap">
  <div class="progress-a" id="progA" style="width:0%"></div>
  <div class="progress-b" id="progB" style="width:0%"></div>
</div>

<div class="container">
  <div class="time timeA" id="timeA">
    <div class="flag" id="flagA"></div>
    <input class="nome" value="Equipe A" id="nomeA">
    <div class="pontos-wrap">
      <span class="pontos" id="pA">0</span>
    </div>
    <div class="vitorias-wrap">
      <span class="vitorias-label">Vitórias</span>
      <button class="btn-v btn-v-minus" onclick="addVit('A',-1)">−</button>
      <span class="vitorias-num" id="vA">0</span>
      <button class="btn-v btn-v-plus"  onclick="addVit('A',1)">+</button>
    </div>
    <div class="botoes">
      <button class="btn btn5"   onclick="add('A',5)">+5</button>
      <button class="btn btn10"  onclick="add('A',10)">+10</button>
      <button class="btn btn20"  onclick="add('A',20)">+20</button>
      <button class="btn btn25"  onclick="add('A',30)">+30</button>
      <button class="btn btnNeg" onclick="add('A',-5)">−5</button>
      <button class="btn btnNeg" onclick="add('A',-10)">−10</button>
    </div>
  </div>

  <div class="time timeB" id="timeB">
    <div class="flag" id="flagB"></div>
    <input class="nome" value="Equipe B" id="nomeB">
    <div class="pontos-wrap">
      <span class="pontos" id="pB">0</span>
    </div>
    <div class="vitorias-wrap">
      <span class="vitorias-label">Vitórias</span>
      <button class="btn-v btn-v-minus" onclick="addVit('B',-1)">−</button>
      <span class="vitorias-num" id="vB">0</span>
      <button class="btn-v btn-v-plus"  onclick="addVit('B',1)">+</button>
    </div>
    <div class="botoes">
      <button class="btn btn5"   onclick="add('B',5)">+5</button>
      <button class="btn btn10"  onclick="add('B',10)">+10</button>
      <button class="btn btn20"  onclick="add('B',20)">+20</button>
      <button class="btn btn25"  onclick="add('B',30)">+30</button>
      <button class="btn btnNeg" onclick="add('B',-5)">−5</button>
      <button class="btn btnNeg" onclick="add('B',-10)">−10</button>
    </div>
  </div>
</div>

<div class="bottom">
  <button class="btn-reset" onclick="resetar()">↺ Resetar Placar</button>
  <button class="btn-reset" onclick="resetarVitorias()" style="margin-left:8px;">↺ Resetar Vitórias</button>
</div>

<div class="toast" id="toast"></div>

<!-- Modal reset placar -->

<div id="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:200; align-items:center; justify-content:center;">
  <div style="background:#1a1a26; border:1px solid rgba(255,255,255,0.12); border-radius:20px; padding:28px 24px; text-align:center; max-width:280px; width:90%;">
    <div style="font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:2px; margin-bottom:8px;">Resetar jogo?</div>
    <div style="font-size:13px; color:#6b6b80; margin-bottom:22px;">O placar será zerado.</div>
    <div style="display:flex; gap:10px; justify-content:center;">
      <button onclick="cancelarReset()" style="flex:1; font-family:'DM Sans',sans-serif; font-weight:700; font-size:14px; padding:11px; border-radius:10px; border:1px solid rgba(255,255,255,0.15); background:transparent; color:#e8e8f0; cursor:pointer;">Cancelar</button>
      <button onclick="confirmarReset()" style="flex:1; font-family:'DM Sans',sans-serif; font-weight:700; font-size:14px; padding:11px; border-radius:10px; border:none; background:#facc15; color:#000; cursor:pointer;">Resetar</button>
    </div>
  </div>
</div>

<!-- Modal reset vitórias -->

<div id="modalVitorias" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:200; align-items:center; justify-content:center;">
  <div style="background:#1a1a26; border:1px solid rgba(255,255,255,0.12); border-radius:20px; padding:28px 24px; text-align:center; max-width:280px; width:90%;">
    <div style="font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:2px; margin-bottom:8px;">Resetar vitórias?</div>
    <div style="font-size:13px; color:#6b6b80; margin-bottom:22px;">O contador de vitórias será zerado.</div>
    <div style="display:flex; gap:10px; justify-content:center;">
      <button onclick="cancelarResetVitorias()" style="flex:1; font-family:'DM Sans',sans-serif; font-weight:700; font-size:14px; padding:11px; border-radius:10px; border:1px solid rgba(255,255,255,0.15); background:transparent; color:#e8e8f0; cursor:pointer;">Cancelar</button>
      <button onclick="confirmarResetVitorias()" style="flex:1; font-family:'DM Sans',sans-serif; font-weight:700; font-size:14px; padding:11px; border-radius:10px; border:none; background:#facc15; color:#000; cursor:pointer;">Resetar</button>
    </div>
  </div>
</div>

<!-- Firebase SDK -->

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ============================================================
// COLE AQUI AS SUAS CREDENCIAIS DO FIREBASE
// ============================================================
const firebaseConfig = {
  apiKey:            "AIzaSyCHfgD-FDgAW-MSnz_QnaeQXkc15ohjm1I",
  authDomain:        "domino-fa285.firebaseapp.com",
  databaseURL:       "https://domino-fa285-default-rtdb.firebaseio.com",
  projectId:         "domino-fa285",
  storageBucket:     "domino-fa285.firebasestorage.app",
  messagingSenderId: "462709449311",
  appId:             "1:462709449311:web:569624eeac6fc57c0631ea"
};
// ============================================================

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);
const jogoRef = ref(db, 'domino/jogo');

let pontos   = { A: 0, B: 0 };
let vitorias = { A: 0, B: 0 };
let _ignorarProximoUpdate = false;

const fbStatus = document.getElementById('fb-status');

// ---- Salvar estado no Firebase ----
function salvar() {
  _ignorarProximoUpdate = true;
  const estado = {
    pontos,
    vitorias,
    meta:  parseInt(document.getElementById('meta').value) || 200,
    nomeA: document.getElementById('nomeA').value || 'Equipe A',
    nomeB: document.getElementById('nomeB').value || 'Equipe B',
    ts:    Date.now()
  };
  set(jogoRef, estado)
    .then(() => {
      fbStatus.textContent = '⬤ online';
      fbStatus.className = 'ok';
    })
    .catch(() => {
      fbStatus.textContent = '⬤ erro';
      fbStatus.className = 'err';
    });
}

// ---- Escutar mudanças (para detectar reset feito externamente) ----
onValue(jogoRef, (snap) => {
  if (_ignorarProximoUpdate) { _ignorarProximoUpdate = false; return; }
  const d = snap.val();
  if (!d) return;
  pontos   = d.pontos   || { A: 0, B: 0 };
  vitorias = d.vitorias || { A: 0, B: 0 };
  document.getElementById('meta').value  = d.meta  || 200;
  document.getElementById('nomeA').value = d.nomeA || 'Equipe A';
  document.getElementById('nomeB').value = d.nomeB || 'Equipe B';
  document.getElementById('vA').textContent = vitorias.A;
  document.getElementById('vB').textContent = vitorias.B;
  atualizar();
}, (err) => {
  fbStatus.textContent = '⬤ offline';
  fbStatus.className = 'err';
});

// ---- Sincronizar nomes e meta ao editar ----
document.getElementById('nomeA').addEventListener('input', salvar);
document.getElementById('nomeB').addEventListener('input', salvar);
document.getElementById('meta').addEventListener('input', salvar);

// ---- Funções do jogo ----
window.addVit = function(time, val) {
  vitorias[time] += val;
  if (vitorias[time] < 0) vitorias[time] = 0;
  document.getElementById('v' + time).textContent = vitorias[time];
  salvar();
};

window.resetarVitorias = function() {
  document.getElementById('modalVitorias').style.display = 'flex';
};

window.confirmarResetVitorias = function() {
  document.getElementById('modalVitorias').style.display = 'none';
  vitorias = { A: 0, B: 0 };
  document.getElementById('vA').textContent = 0;
  document.getElementById('vB').textContent = 0;
  salvar();
};

window.cancelarResetVitorias = function() {
  document.getElementById('modalVitorias').style.display = 'none';
};

function falar(valor, time) {
  try {
    if (!window.speechSynthesis) return;
    const map = { 5:'cinco', 10:'dez', 20:'vinte', 30:'trinta', [-5]:'menos cinco', [-10]:'menos dez' };
    const valorTexto = map[valor] || '';
    if (!valorTexto) return;
    const nomeTime = document.getElementById('nome' + time).value || 'Equipe ' + time;
    window.speechSynthesis.cancel();
    const fala = new SpeechSynthesisUtterance(nomeTime + ', ' + valorTexto);
    fala.lang = 'pt-BR';
    window.speechSynthesis.speak(fala);
  } catch(e) {}
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function bumpEl(id) {
  const el = document.getElementById(id);
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
}

function atualizar() {
  const meta = parseInt(document.getElementById('meta').value) || 200;
  document.getElementById('pA').textContent = pontos.A;
  document.getElementById('pB').textContent = pontos.B;

  const timeA = document.getElementById('timeA');
  const timeB = document.getElementById('timeB');
  const flagA = document.getElementById('flagA');
  const flagB = document.getElementById('flagB');

  flagA.textContent = '';
  flagB.textContent = '';
  timeA.classList.remove('lider', 'venceu');
  timeB.classList.remove('lider', 'venceu');

  if (pontos.A > pontos.B) { flagA.textContent = '🏁'; timeA.classList.add('lider'); }
  else if (pontos.B > pontos.A) { flagB.textContent = '🏁'; timeB.classList.add('lider'); }

  const progA = document.getElementById('progA');
  const progB = document.getElementById('progB');
  const total = pontos.A + pontos.B;
  if (total > 0) {
    progA.style.width = (pontos.A / (meta * 2) * 100).toFixed(1) + '%';
    progB.style.width = (pontos.B / (meta * 2) * 100).toFixed(1) + '%';
  } else {
    progA.style.width = '0%';
    progB.style.width = '0%';
  }

  const nomeA = document.getElementById('nomeA').value || 'Equipe A';
  const nomeB = document.getElementById('nomeB').value || 'Equipe B';
  if (pontos.A >= meta) { timeA.classList.add('venceu'); showToast('🏆 ' + nomeA + ' venceu!'); }
  if (pontos.B >= meta) { timeB.classList.add('venceu'); showToast('🏆 ' + nomeB + ' venceu!'); }
}

window.resetar = function() {
  document.getElementById('modal').style.display = 'flex';
};

window.confirmarReset = function() {
  document.getElementById('modal').style.display = 'none';
  pontos = { A: 0, B: 0 };
  document.getElementById('timeA').classList.remove('venceu', 'lider');
  document.getElementById('timeB').classList.remove('venceu', 'lider');
  document.getElementById('flagA').textContent = '';
  document.getElementById('flagB').textContent = '';
  atualizar();
  salvar();
};

window.cancelarReset = function() {
  document.getElementById('modal').style.display = 'none';
};

window.add = function(time, valor) {
  pontos[time] += valor;
  if (pontos[time] < 0) pontos[time] = 0;
  bumpEl('p' + time);
  falar(valor, time);
  atualizar();
  salvar();
};

atualizar();
</script>

</body>
</html>
