<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placar do Jogo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@400;700&display=swap');
        
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
        }
        
        .score-font {
            font-family: 'Orbitron', monospace;
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .timer-glow {
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }
        
        .timer-overtime {
            color: #ef4444 !important;
            text-shadow: 0 0 30px rgba(239, 68, 68, 0.8) !important;
            animation: pulse-red 1s infinite;
        }
        
        @keyframes pulse-red {
            0%, 100% { 
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 0 0 20px rgba(239, 68, 68, 0);
                transform: scale(1.05);
            }
        }
        
        .btn-press {
            transition: transform 0.1s;
        }
        .btn-press:active {
            transform: scale(0.95);
        }
        
        .goal-animation {
            animation: goalPop 0.5s ease-out;
        }
        
        @keyframes goalPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); color: #fbbf24; }
            100% { transform: scale(1); }
        }
        
        .vs-divider {
            background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.3) 20%, rgba(255,255,255,0.3) 80%, transparent 100%);
            width: 2px;
        }
        
        .overtime-badge {
            background: linear-gradient(90deg, #ef4444, #dc2626);
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .team-input {
            background: transparent;
            border: 2px dashed rgba(255,255,255,0.3);
            text-align: center;
            width: 100%;
            transition: all 0.3s;
        }
        
        .team-input:focus {
            outline: none;
            border-color: rgba(255,255,255,0.8);
            background: rgba(255,255,255,0.1);
        }
        
        .team-input:hover {
            border-color: rgba(255,255,255,0.5);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="w-full max-w-5xl">
        <!-- Título -->
        <h1 class="text-4xl md:text-5xl font-black text-white text-center mb-6 tracking-wider uppercase drop-shadow-lg">
            ⚽ Placar do Jogo ⚽
        </h1>
        
        <div class="glass rounded-3xl p-6 md:p-8 shadow-2xl">
            <!-- Configuração do Tempo e Hora -->
            <div class="flex flex-col items-center mb-6 gap-2">
                <div class="flex items-center space-x-4 bg-white/10 rounded-full px-6 py-2">
                    <label class="text-white font-bold">Meta:</label>
                    <input type="number" id="targetTime" value="10" min="1" max="120"
                        class="w-16 bg-white/20 text-white text-center text-xl font-bold rounded-lg px-2 py-1 border-2 border-white/30 focus:border-yellow-400 focus:outline-none score-font">
                    <span class="text-white">min</span>
                </div>
                
                <!-- Hora Atual abaixo da meta -->
                <div class="bg-black/30 rounded-full px-6 py-2 border border-white/20">
                    <span class="text-white/60 text-sm uppercase tracking-wider mr-2">Hora Atual:</span>
                    <span id="currentClock" class="score-font text-lg text-yellow-400 font-bold">--:--:--</span>
                </div>
            </div>
            
            <!-- Cronômetro Central -->
            <div class="text-center mb-4">
                <div id="timerContainer" class="inline-block bg-black/40 rounded-2xl px-8 py-4 border-4 border-white/20 relative">
                    <div id="overtimeBadge" class="hidden absolute -top-3 left-1/2 transform -translate-x-1/2 overtime-badge text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">
                        ⏰ Acréscimo!
                    </div>
                    <div id="timer" class="score-font text-5xl md:text-7xl font-black text-white timer-glow tabular-nums transition-colors duration-300">
                        00:00
                    </div>
                </div>
            </div>
            
            <!-- Controles do Cronômetro -->
            <div class="flex justify-center gap-3 mb-8 flex-wrap">
                <button onclick="startTimer()" id="btnStart" 
                    class="btn-press bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-6 rounded-full shadow-lg transform transition hover:scale-105 text-sm">
                    ▶ Iniciar
                </button>
                <button onclick="pauseTimer()" 
                    class="btn-press bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 px-6 rounded-full shadow-lg transform transition hover:scale-105 text-sm">
                    ⏸ Pausar
                </button>
                <button onclick="resetTimer()" 
                    class="btn-press bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-6 rounded-full shadow-lg transform transition hover:scale-105 text-sm">
                    ↺ Resetar
                </button>
            </div>
            
            <!-- Placar Horizontal -->
            <div class="flex items-center justify-center gap-4 md:gap-8 mb-6">
                <!-- Time A -->
                <div class="flex-1 max-w-xs bg-gradient-to-br from-blue-600 to-blue-800 rounded-2xl p-4 md:p-6 text-center shadow-xl border-4 border-blue-400/30">
                    <input type="text" id="teamAName" value="Time A" 
                        class="team-input text-xl md:text-2xl font-bold text-white mb-3 uppercase tracking-wider bg-transparent placeholder-white/50"
                        onblur="updateTeamName('A')" onkeypress="if(event.key==='Enter'){this.blur();}">
                    <div id="scoreA" class="score-font text-6xl md:text-7xl font-black text-white mb-4 drop-shadow-2xl">0</div>
                    <button onclick="addGoal('A')" 
                        class="btn-press w-full bg-white text-blue-600 font-black text-lg py-3 rounded-xl shadow-lg hover:bg-blue-50 transition flex items-center justify-center gap-2">
                        <span class="text-2xl">⚽</span> GOL
                    </button>
                </div>
                
                <!-- VS Divider -->
                <div class="flex flex-col items-center justify-center">
                    <div class="vs-divider h-20 md:h-24 mb-2"></div>
                    <span class="text-white/50 font-black text-2xl md:text-3xl italic">VS</span>
                    <div class="vs-divider h-20 md:h-24 mt-2"></div>
                </div>
                
                <!-- Time B -->
                <div class="flex-1 max-w-xs bg-gradient-to-br from-red-600 to-red-800 rounded-2xl p-4 md:p-6 text-center shadow-xl border-4 border-red-400/30">
                    <input type="text" id="teamBName" value="Time B" 
                        class="team-input text-xl md:text-2xl font-bold text-white mb-3 uppercase tracking-wider bg-transparent placeholder-white/50"
                        onblur="updateTeamName('B')" onkeypress="if(event.key==='Enter'){this.blur();}">
                    <div id="scoreB" class="score-font text-6xl md:text-7xl font-black text-white mb-4 drop-shadow-2xl">0</div>
                    <button onclick="addGoal('B')" 
                        class="btn-press w-full bg-white text-red-600 font-black text-lg py-3 rounded-xl shadow-lg hover:bg-red-50 transition flex items-center justify-center gap-2">
                        <span class="text-2xl">⚽</span> GOL
                    </button>
                </div>
            </div>
            
            <!-- Histórico de Gols -->
            <div class="bg-black/20 rounded-xl p-4 max-w-2xl mx-auto">
                <h3 class="text-white font-bold mb-3 uppercase tracking-wider text-sm text-center">Histórico de Gols</h3>
                <div id="goalHistory" class="text-white/80 text-sm space-y-1 max-h-24 overflow-y-auto text-center">
                    <div class="text-white/40 italic">Nenhum gol registrado ainda...</div>
                </div>
            </div>
            
            <!-- Reset Placar -->
            <div class="mt-4 text-center">
                <button onclick="resetScore()" 
                    class="text-white/60 hover:text-white underline text-sm transition">
                    Zerar Placar
                </button>
            </div>
        </div>
    </div>
    
    <!-- Alarme Overlay -->
    <div id="alarmOverlay" class="fixed inset-0 bg-red-600/90 hidden items-center justify-center z-50">
        <div class="text-center">
            <div class="text-8xl mb-4 animate-bounce">⏰</div>
            <h2 class="text-5xl md:text-6xl font-black text-white mb-4 animate-pulse">TEMPO ENCERRADO!</h2>
            <p class="text-xl text-white/90 mb-4">Continuando contagem...</p>
            <p class="text-3xl font-bold text-yellow-300 mb-8" id="currentOvertime">00:00</p>
            <button onclick="stopAlarm()" 
                class="bg-white text-red-600 font-black text-xl py-3 px-10 rounded-full shadow-2xl hover:scale-110 transition transform">
                OK (Continuar)
            </button>
        </div>
    </div>

    <script>
        let timerInterval;
        let clockInterval;
        let seconds = 0;
        let isRunning = false;
        let targetReached = false;
        let alarmPlaying = false;
        let scoreA = 0;
        let scoreB = 0;
        let alarmInterval;
        let teamAName = 'Time A';
        let teamBName = 'Time B';
        
        // Iniciar relógio de hora atual
        function startClock() {
            updateClock();
            clockInterval = setInterval(updateClock, 1000);
        }
        
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('pt-BR', { hour12: false });
            document.getElementById('currentClock').textContent = timeString;
        }
        
        function formatTime(totalSeconds) {
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        function updateDisplay() {
            document.getElementById('timer').textContent = formatTime(seconds);
            if (targetReached) {
                document.getElementById('currentOvertime').textContent = formatTime(seconds);
            }
        }
        
        function startTimer() {
            if (!isRunning) {
                isRunning = true;
                document.getElementById('btnStart').classList.add('opacity-50', 'cursor-not-allowed');
                timerInterval = setInterval(() => {
                    seconds++;
                    updateDisplay();
                    checkAlarm();
                }, 1000);
            }
        }
        
        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            document.getElementById('btnStart').classList.remove('opacity-50', 'cursor-not-allowed');
        }
        
        function resetTimer() {
            pauseTimer();
            seconds = 0;
            targetReached = false;
            alarmPlaying = false;
            clearInterval(alarmInterval);
            updateDisplay();
            document.getElementById('timer').classList.remove('timer-overtime');
            document.getElementById('overtimeBadge').classList.add('hidden');
            stopAlarm();
            // Zera os gols ao resetar o tempo
            resetScore();
        }
        
        function checkAlarm() {
            const targetMinutes = parseInt(document.getElementById('targetTime').value) || 10;
            const targetSeconds = targetMinutes * 60;
            
            if (seconds >= targetSeconds && !targetReached) {
                targetReached = true;
                triggerAlarm(targetMinutes);
            }
        }
        
        function triggerAlarm(minutes) {
            document.getElementById('overtimeBadge').classList.remove('hidden');
            document.getElementById('timer').classList.add('timer-overtime');
            document.getElementById('alarmOverlay').classList.remove('hidden');
            document.getElementById('alarmOverlay').classList.add('flex');
            playContinuousAlarm();
        }
        
        function playContinuousAlarm() {
            alarmPlaying = true;
            playBeepSequence();
            alarmInterval = setInterval(() => {
                if (alarmPlaying) {
                    playBeepSequence();
                }
            }, 2000);
        }
        
        function playBeepSequence() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            
            [0, 300, 600].forEach((delay) => {
                setTimeout(() => {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.frequency.value = 1000;
                    oscillator.type = 'square';
                    
                    gainNode.gain.setValueAtTime(0.5, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                    
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.3);
                }, delay);
            });
        }
        
        function stopAlarm() {
            alarmPlaying = false;
            clearInterval(alarmInterval);
            document.getElementById('alarmOverlay').classList.add('hidden');
            document.getElementById('alarmOverlay').classList.remove('flex');
        }
        
        function updateTeamName(team) {
            const input = document.getElementById(`team${team}Name`);
            const newName = input.value.trim() || `Time ${team}`;
            if (team === 'A') {
                teamAName = newName;
            } else {
                teamBName = newName;
            }
            input.value = newName;
        }
        
        function addGoal(team) {
            const currentTime = formatTime(seconds);
            const historyDiv = document.getElementById('goalHistory');
            const teamName = team === 'A' ? teamAName : teamBName;
            
            if (team === 'A') {
                scoreA++;
                document.getElementById('scoreA').textContent = scoreA;
                document.getElementById('scoreA').classList.add('goal-animation');
                setTimeout(() => document.getElementById('scoreA').classList.remove('goal-animation'), 500);
            } else {
                scoreB++;
                document.getElementById('scoreB').textContent = scoreB;
                document.getElementById('scoreB').classList.add('goal-animation');
                setTimeout(() => document.getElementById('scoreB').classList.remove('goal-animation'), 500);
            }
            
            if (historyDiv.children[0] && historyDiv.children[0].classList.contains('italic')) {
                historyDiv.innerHTML = '';
            }
            
            const goalEntry = document.createElement('div');
            goalEntry.className = 'flex justify-between items-center bg-white/10 rounded px-3 py-2 animate-pulse';
            goalEntry.innerHTML = `
                <span>⚽ ${teamName}</span>
                <span class="font-mono text-yellow-400">${currentTime}</span>
            `;
            historyDiv.insertBefore(goalEntry, historyDiv.firstChild);
            
            setTimeout(() => goalEntry.classList.remove('animate-pulse'), 1000);
        }
        
        function resetScore() {
            scoreA = 0;
            scoreB = 0;
            document.getElementById('scoreA').textContent = '0';
            document.getElementById('scoreB').textContent = '0';
            document.getElementById('goalHistory').innerHTML = '<div class="text-white/40 italic">Nenhum gol registrado ainda...</div>';
        }
        
        document.getElementById('targetTime').addEventListener('change', function() {
            if (isRunning) {
                alert('Pare o cronômetro antes de alterar a meta de tempo!');
                this.value = this.defaultValue;
            }
        });
        
        // Iniciar relógio ao carregar
        startClock();
    </script>
</body>
</html>
