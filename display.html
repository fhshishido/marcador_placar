<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>Placar Dominó</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --surface2: #1a1a26;
  --azul: #3b82f6;
  --azul-glow: rgba(59,130,246,0.35);
  --vermelho: #ef4444;
  --verm-glow: rgba(239,68,68,0.35);
  --ouro: #f59e0b;
  --texto: #e8e8f0;
  --muted: #6b6b80;
  --radius: 20px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--texto);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  -webkit-text-size-adjust: 100%;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 0; opacity: 0.5;
}

body::after {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none; z-index: 0;
}

/* Badge AO VIVO */
#badge-live {
  position: fixed;
  top: 10px; left: 12px;
  z-index: 999;
  font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  padding: 4px 10px; border-radius: 99px;
  background: rgba(239,68,68,0.15); border: 1px solid var(--vermelho); color: var(--vermelho);
  display: flex; align-items: center; gap: 5px;
}
#badge-live::before {
  content: '';
  width: 7px; height: 7px; border-radius: 50%; background: var(--vermelho);
  animation: pulse 1.4s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.4; transform: scale(0.7); }
}

/* Status Firebase */
#fb-status {
  position: fixed;
  top: 10px; right: 12px;
  z-index: 999;
  font-size: 11px; font-weight: 700; letter-spacing: 1px;
  padding: 4px 10px; border-radius: 99px;
  background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); color: var(--muted);
  transition: all 0.3s;
}
#fb-status.ok  { color: #4ade80; border-color: #4ade80; }
#fb-status.err { color: #f87171; border-color: #f87171; }

header {
  position: relative; z-index: 10;
  text-align: center;
  padding: 20px 16px 10px;
  display: flex; align-items: center; justify-content: center;
}

.header-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(28px, 8vw, 42px);
  letter-spacing: 6px;
  background: linear-gradient(135deg, #fff 30%, var(--muted));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}

.domino-icon { display: inline-flex; gap: 4px; align-items: center; margin-bottom: 6px; }
.tile {
  width: 22px; height: 38px; background: var(--surface2); border-radius: 4px;
  border: 1.5px solid rgba(255,255,255,0.12);
  display: flex; flex-direction: column; align-items: center; justify-content: space-around;
  padding: 4px 3px; gap: 2px;
}
.pip-row { display: flex; gap: 3px; }
.pip { width: 4px; height: 4px; border-radius: 50%; background: white; }

/* META */
.meta-wrap {
  position: relative; z-index: 10;
  display: flex; align-items: center; justify-content: center;
  gap: 10px; margin: 8px auto 16px;
}
.meta-label { font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
.meta-val { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 2px; color: var(--ouro); }

/* PROGRESS */
.progress-wrap {
  position: relative; z-index: 10; margin: 0 12px 18px;
  height: 6px; background: var(--surface2); border-radius: 99px;
  overflow: visible; display: flex; gap: 2px;
}
.progress-a, .progress-b {
  height: 100%; border-radius: 99px;
  transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.progress-a { background: linear-gradient(90deg, #1d4ed8, var(--azul)); }
.progress-b { background: linear-gradient(90deg, #b91c1c, var(--vermelho)); }

.container { position: relative; z-index: 10; display: flex; gap: 10px; padding: 0 12px; }

.time {
  flex: 1; background: var(--surface); border-radius: var(--radius);
  padding: 18px 12px 20px; text-align: center; position: relative; overflow: hidden;
  transition: transform 0.3s ease, box-shadow 0.3s ease; border: 1px solid rgba(255,255,255,0.06);
}
.time::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  border-radius: var(--radius) var(--radius) 0 0;
}
.timeA::before { background: linear-gradient(90deg, #1d4ed8, var(--azul), #60a5fa); }
.timeB::before { background: linear-gradient(90deg, #b91c1c, var(--vermelho), #f87171); }
.time::after {
  content: ''; position: absolute; width: 120px; height: 120px;
  border-radius: 50%; top: -40px; opacity: 0.12; filter: blur(40px);
  pointer-events: none; transition: opacity 0.4s;
}
.timeA::after { background: var(--azul); left: -20px; }
.timeB::after { background: var(--vermelho); right: -20px; }

.time.lider::after { opacity: 0.3; }
.time.lider {
  transform: translateY(-3px);
  box-shadow: 0 0 24px rgba(34,197,94,0.5), 0 0 48px rgba(34,197,94,0.25);
  border-color: rgba(34,197,94,0.4);
  animation: pulsoVerde 1.6s ease-in-out infinite;
}
@keyframes pulsoVerde {
  0%,100% { box-shadow: 0 0 18px rgba(34,197,94,0.4), 0 0 40px rgba(34,197,94,0.2); }
  50%      { box-shadow: 0 0 36px rgba(34,197,94,0.75), 0 0 70px rgba(34,197,94,0.4); }
}
.time.lider::before { background: linear-gradient(90deg, #15803d, #22c55e, #86efac) !important; }

.nome-display {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(18px, 5vw, 22px); letter-spacing: 3px; color: white; text-align: center;
}

.pontos-wrap { position: relative; margin: 10px 0 8px; }
.pontos {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(72px, 20vw, 100px); line-height: 1; letter-spacing: -2px; display: block;
}
.timeA .pontos { color: #93c5fd; }
.timeB .pontos { color: #fca5a5; }

.pontos.bump { animation: bump 0.25s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
@keyframes bump {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.12); }
  70%  { transform: scale(0.95); }
  100% { transform: scale(1); }
}

.time.venceu .pontos {
  background: linear-gradient(135deg, var(--ouro), #fde68a, var(--ouro));
  background-size: 200% auto; -webkit-background-clip: text;
  -webkit-text-fill-color: transparent; background-clip: text;
  animation: shimmer 2s linear infinite;
}
@keyframes shimmer { to { background-position: 200% center; } }

/* Histórico */
.historico-wrap {
  margin: 0 0 12px; background: rgba(255,255,255,0.04);
  border-radius: 12px; padding: 7px 8px 6px; min-height: 34px;
}
.historico-label {
  font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  color: var(--muted); margin-bottom: 5px; text-align: left;
}
.historico-lista {
  display: flex; gap: 5px; justify-content: flex-start; flex-wrap: nowrap; overflow: hidden; min-height: 22px;
}
.hist-item {
  font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 0.5px;
  padding: 2px 7px; border-radius: 99px; white-space: nowrap;
  animation: fadeSlide 0.3s cubic-bezier(0.34, 1.4, 0.64, 1);
}
@keyframes fadeSlide {
  from { transform: translateY(-8px) scale(0.8); opacity: 0; }
  to   { transform: translateY(0) scale(1);      opacity: 1; }
}
.hist-item:nth-child(1) { opacity: 1; }
.hist-item:nth-child(2) { opacity: 0.75; }
.hist-item:nth-child(3) { opacity: 0.55; }
.hist-item:nth-child(4) { opacity: 0.38; }
.hist-item:nth-child(5) { opacity: 0.22; }
.timeA .hist-item.pos { background: rgba(59,130,246,0.25); color: #93c5fd; border: 1px solid rgba(59,130,246,0.3); }
.timeA .hist-item.neg { background: rgba(239,68,68,0.18);  color: #fca5a5; border: 1px solid rgba(239,68,68,0.25); }
.timeB .hist-item.pos { background: rgba(239,68,68,0.22);  color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
.timeB .hist-item.neg { background: rgba(59,130,246,0.18); color: #93c5fd; border: 1px solid rgba(59,130,246,0.25); }

/* Vitórias */
.vitorias-wrap {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; margin: 0; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 8px 10px;
}
.vitorias-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); flex: 1; text-align: left; }
.vitorias-num { font-family: 'Bebas Neue', sans-serif; font-size: 32px; line-height: 1; color: var(--ouro); min-width: 28px; text-align: center; }

/* Toast */
.toast {
  position: fixed; bottom: 30px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--ouro); color: #000;
  font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px;
  padding: 12px 28px; border-radius: 99px; z-index: 100; opacity: 0;
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); white-space: nowrap; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Overlay de toque (libera voz no iOS) */
#tap-overlay {
  position: fixed; inset: 0; background: rgba(10,10,15,0.92);
  z-index: 500; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 16px; cursor: pointer;
}
#tap-overlay .tap-icon { font-size: 52px; }
#tap-overlay .tap-text { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 4px; color: var(--ouro); }
#tap-overlay .tap-sub  { font-size: 13px; color: var(--muted); letter-spacing: 1px; }
</style>

</head>
<body>

<div id="tap-overlay" onclick="liberarVoz()">
  <div class="tap-icon">🎙️</div>
  <div class="tap-text">Toque para começar</div>
  <div class="tap-sub">Necessário para ativar o placar com voz</div>
</div>

<div id="badge-live">AO VIVO</div>
<div id="fb-status">⬤ conectando</div>

<header>
  <div style="display:flex; flex-direction:column; align-items:center;">
    <div class="domino-icon">
      <div class="tile">
        <div class="pip-row"><div class="pip"></div><div class="pip"></div></div>
        <div style="width:100%;height:1px;background:rgba(255,255,255,0.2)"></div>
        <div class="pip-row"><div class="pip"></div><div class="pip"></div></div>
      </div>
      <div class="tile">
        <div class="pip-row"><div class="pip"></div></div>
        <div style="width:100%;height:1px;background:rgba(255,255,255,0.2)"></div>
        <div class="pip-row"><div class="pip"></div><div class="pip"></div></div>
      </div>
    </div>
    <div class="header-title">Placar Dominó</div>
  </div>
</header>

<div class="meta-wrap">
  <span class="meta-label">Meta</span>
  <span class="meta-val" id="metaVal">200</span>
</div>

<div class="progress-wrap">
  <div class="progress-a" id="progA" style="width:0%"></div>
  <div class="progress-b" id="progB" style="width:0%"></div>
</div>

<div class="container">
  <div class="time timeA" id="timeA">
    <div class="nome-display" id="nomeA">Equipe A</div>
    <div class="pontos-wrap"><span class="pontos" id="pA">0</span></div>
    <div class="historico-wrap">
      <div class="historico-label">Últimos lances</div>
      <div class="historico-lista" id="histA"></div>
    </div>
    <div class="vitorias-wrap">
      <span class="vitorias-label">Vitórias</span>
      <span class="vitorias-num" id="vA">0</span>
    </div>
  </div>

  <div class="time timeB" id="timeB">
    <div class="nome-display" id="nomeB">Equipe B</div>
    <div class="pontos-wrap"><span class="pontos" id="pB">0</span></div>
    <div class="historico-wrap">
      <div class="historico-label">Últimos lances</div>
      <div class="historico-lista" id="histB"></div>
    </div>
    <div class="vitorias-wrap">
      <span class="vitorias-label">Vitórias</span>
      <span class="vitorias-num" id="vB">0</span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase SDK compat -->

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:            "AIzaSyCHfgD-FDgAW-MSnz_QnaeQXkc15ohjm1I",
  authDomain:        "domino-fa285.firebaseapp.com",
  databaseURL:       "https://domino-fa285-default-rtdb.firebaseio.com",
  projectId:         "domino-fa285",
  storageBucket:     "domino-fa285.firebasestorage.app",
  messagingSenderId: "462709449311",
  appId:             "1:462709449311:web:569624eeac6fc57c0631ea"
});

const db       = firebase.database();
const jogoRef  = db.ref('domino/jogo');
const fbStatus = document.getElementById('fb-status');

let vozLiberada    = false;
let estadoAnterior = null;
let primeiraLeitura = true;

// Libera voz no iOS (exige gesto do usuário)
window.liberarVoz = function() {
  document.getElementById('tap-overlay').style.display = 'none';
  vozLiberada = true;
  try {
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    window.speechSynthesis.speak(u);
  } catch(e) {}
};

function falar(texto) {
  if (!vozLiberada || !window.speechSynthesis) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = 'pt-BR'; u.rate = 1.1;
    window.speechSynthesis.speak(u);
  } catch(e) {}
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function bumpEl(id) {
  const el = document.getElementById(id);
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
}

function renderHistorico(time, lista) {
  const c = document.getElementById('hist' + time);
  c.innerHTML = '';
  (lista || []).forEach((v) => {
    const s = document.createElement('span');
    s.className = 'hist-item ' + (v >= 0 ? 'pos' : 'neg');
    s.textContent = (v > 0 ? '+' : '') + v;
    c.appendChild(s);
  });
}

function aplicarEstado(d) {
  const meta     = d.meta     || 200;
  const pontos   = d.pontos   || { A: 0, B: 0 };
  const vitorias = d.vitorias || { A: 0, B: 0 };
  const historico = d.historico || { A: [], B: [] };
  const nomeA    = d.nomeA    || 'Equipe A';
  const nomeB    = d.nomeB    || 'Equipe B';

  document.getElementById('metaVal').textContent = meta;
  document.getElementById('nomeA').textContent   = nomeA;
  document.getElementById('nomeB').textContent   = nomeB;
  document.getElementById('vA').textContent      = vitorias.A;
  document.getElementById('vB').textContent      = vitorias.B;

  // Detectar mudanças de pontos para voz + animação
  if (estadoAnterior && !primeiraLeitura) {
    const diffA = pontos.A - (estadoAnterior.pontos?.A || 0);
    const diffB = pontos.B - (estadoAnterior.pontos?.B || 0);

    if (diffA !== 0) {
      bumpEl('pA');
      const texto = diffA > 0 ? nomeA + ', mais ' + diffA : nomeA + ', menos ' + Math.abs(diffA);
      falar(texto);
    }
    if (diffB !== 0) {
      bumpEl('pB');
      const texto = diffB > 0 ? nomeB + ', mais ' + diffB : nomeB + ', menos ' + Math.abs(diffB);
      if (diffA === 0) falar(texto); // evita sobrescrever fala do A
      else setTimeout(() => falar(texto), 800);
    }

    // Toast de vencendo
    if (pontos.A >= meta && (estadoAnterior.pontos?.A || 0) < meta) showToast('🏆 ' + nomeA + ' vencendo!');
    if (pontos.B >= meta && (estadoAnterior.pontos?.B || 0) < meta) showToast('🏆 ' + nomeB + ' vencendo!');

    // Toast de partida reiniciada
    if (pontos.A === 0 && pontos.B === 0 && (estadoAnterior.pontos?.A > 0 || estadoAnterior.pontos?.B > 0)) {
      showToast('🎯 Partida iniciada!');
    }
  }

  document.getElementById('pA').textContent = pontos.A;
  document.getElementById('pB').textContent = pontos.B;

  renderHistorico('A', historico.A);
  renderHistorico('B', historico.B);

  // Líder / venceu
  const tA = document.getElementById('timeA');
  const tB = document.getElementById('timeB');
  tA.classList.remove('lider', 'venceu');
  tB.classList.remove('lider', 'venceu');

  if (pontos.A > pontos.B)      tA.classList.add('lider');
  else if (pontos.B > pontos.A) tB.classList.add('lider');

  if (pontos.A >= meta) tA.classList.add('venceu');
  if (pontos.B >= meta) tB.classList.add('venceu');

  // Progress bars
  const total = pontos.A + pontos.B;
  if (total > 0) {
    document.getElementById('progA').style.width = (pontos.A / (meta * 2) * 100).toFixed(1) + '%';
    document.getElementById('progB').style.width = (pontos.B / (meta * 2) * 100).toFixed(1) + '%';
  } else {
    document.getElementById('progA').style.width = '0%';
    document.getElementById('progB').style.width = '0%';
  }

  estadoAnterior = d;
  primeiraLeitura = false;
}

// Escutar Firebase em tempo real
jogoRef.on('value', (snap) => {
  const d = snap.val();
  if (!d) return;
  aplicarEstado(d);
}, () => {
  fbStatus.textContent = '⬤ offline'; fbStatus.className = 'err';
});

db.ref('.info/connected').on('value', (snap) => {
  if (snap.val()) { fbStatus.textContent = '⬤ online'; fbStatus.className = 'ok'; }
  else            { fbStatus.textContent = '⬤ offline'; fbStatus.className = 'err'; }
});
</script>

</body>
</html>
